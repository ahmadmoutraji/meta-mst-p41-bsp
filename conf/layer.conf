# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "microsensytech"
BBFILE_PATTERN_microsensytech = "^${LAYERDIR}/"
BBFILE_PRIORITY_microsensytech = "21"
LAYERSERIES_COMPAT_microsensytech = "scarthgap"
